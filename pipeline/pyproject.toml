[project]
name = "skypulse-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ytsaurus-client",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["common*", "svc_bootstrap*", "svc_ingest*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "yt.*"
ignore_missing_imports = true
