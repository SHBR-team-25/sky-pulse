services:
  # наружу торчит только nginx, остальное видно лишь внутри compose.
  svc_positions:
    build:
      context: ../backend/positions-service
    env_file: .env
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  svc_analytics:
    build:
      context: ../backend/analytics-service
    env_file: .env
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/parts:/etc/nginx/conf.d/parts:ro
      # В каталоге static хранится только index.html; остальные файлы лежат в Object Storage.
      - ./static:/usr/share/nginx/html:ro
      - ./certs:/etc/letsencrypt:ro
    depends_on:
      - svc_positions
      - svc_analytics
    restart: unless-stopped
