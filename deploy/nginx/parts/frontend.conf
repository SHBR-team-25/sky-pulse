# index.html меняется при каждом деплое, поэтому браузер не должен его кешировать.
location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
}

# Все маршруты SPA возвращают index.html; остальные ассеты загружаются из Object Storage.
location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
}
