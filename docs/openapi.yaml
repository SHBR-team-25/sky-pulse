openapi: 3.0.3
info:
  title: skyPulse API
  description: >-
    Единый контракт бэкенда skyPulse. Под `/api` живут два сервиса:
    `positions-service` — борта, треки, справочник аэропортов и состояние
    пайплайна (теги `flights`, `airports`, `pipeline`), и `analytics-service` —
    агрегаты дашборда и статистика по аэропортам (тег `stats`).


    Раздел `positions-service` описывает то, что сервис **реально отдаёт
    сегодня**. Раздел `analytics-service` — контракт того, что он **сможет
    отдать**: часть ручек ещё не поднята.


    Обновление карты — поллинг `GET /api/flights/live` с клиента. Чаще одного
    раза в 5 секунд смысла нет: пайплайн обновляет позиции раз в 15 секунд.
    Плавность движения маркеров добирается экстраполяцией по `velocity`
    и `trueTrack`, а не частотой запросов.


    Единицы: время — unix seconds в UTC, высота — метры, курс — градусы
    от севера по часовой стрелке. Скорость — **м/с** в `positions-service`
    и **км/ч** в `analytics-service`: OpenSky и `dashboard_totals` хранят её
    в м/с, пересчёт ×3.6 делает сам `analytics-service`, чтобы дашборд
    не считал единицы.
  version: 1.0.0

servers:
  - url: /api

tags:
  - name: flights
    description: Борта, позиции, треки
  - name: airports
    description: >-
      Справочник аэропортов OurAirports, а также рейсы и статистика
      по конкретному аэропорту
  - name: pipeline
    description: Состояние поставщика данных
  - name: stats
    description: Агрегаты дашборда поверх истории полётов

paths:
  /flights/live:
    get:
      tags: [flights]
      summary: Борта для отрисовки маркеров на карте
      description: >-
        Основной запрос карты. Возвращает **плоский массив** позиций, без
        конверта и без метаданных о свежести — за свежестью идти
        в `GET /pipeline-status`.


        Возвращаются **все** борта, попавшие в область, — искусственного
        потолка на размер ответа нет. Без bbox на мировом зуме это порядка
        10–15 тысяч объектов, и прореживать их, если нужно, клиент решает сам.


        Единственная отсечка — по свежести: борт, о котором не было позиции
        дольше `YT_MAX_POSITION_AGE_SECONDS` (по умолчанию 300 с), из выдачи
        пропадает. Она обязательна, потому что `positions_current` хранит
        последнюю позицию каждого `icao24` вечно, и без неё на карте навсегда
        зависают борта, севшие часы назад.
      parameters:
        - $ref: "#/components/parameters/LonMin"
        - $ref: "#/components/parameters/LatMin"
        - $ref: "#/components/parameters/LonMax"
        - $ref: "#/components/parameters/LatMax"
      responses:
        "200":
          description: >-
            Массив позиций. Пустой массив — валидный ответ и **не** признак
            ошибки: так же выглядит и пустой участок карты, и остановленный
            пайплайн. Различить их можно только через `GET /pipeline-status`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flight"
        "400":
          description: >-
            Параметр не разобрался как число либо задан вне карты
            (`lonMin=NaN`, `latMax=200`). Осмысленные, но абсурдные значения
            (перевёрнутая рамка, неполный набор координат) под этот случай
            **не** подпадают — они обрабатываются молча.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"

  /flights/{icao24}:
    get:
      tags: [flights]
      summary: Последняя известная позиция борта
      description: >-
        Карточка борта по клику на карте. Тело ответа — тот же объект, что
        и элемент массива в `GET /flights/live`.


        Трек сюда **не входит**, за ним нужен отдельный запрос
        к `GET /flights/{icao24}/track`.
      parameters:
        - $ref: "#/components/parameters/Icao24"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flight"
        "400":
          description: >-
            `icao24` не прошёл проверку формата — это не 6 hex-символов.
            Поле `message` заполнено по-русски и пригодно для показа
            пользователю.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >-
            Формат кода верный, но борта нет в `positions_current` — он
            не наблюдался дольше окна свежести.


            Поле `message` заполнено по-русски и пригодно для показа
            пользователю.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"

  /flights/{icao24}/track:
    get:
      tags: [flights]
      summary: Трек борта из накопленной истории
      description: >-
        Точки строятся по `positions_history` и приходят **уже
        в хронологическом порядке** — сортировать на клиенте не нужно.


        Плотность точек — одна на опрос пайплайна, то есть примерно раз
        в 15 секунд (около 240 точек за час). В паузах пайплайна в треке будут
        разрывы, поэтому соединять прямой линией далеко разнесённые по времени
        точки не стоит.
      parameters:
        - $ref: "#/components/parameters/Icao24"
        - name: sinceSeconds
          in: query
          required: false
          description: >-
            Глубина окна назад от текущего момента, в секундах. Значение вне
            диапазона 1…86400 — это 400, а не молча усечённое окно: раньше
            отрицательное `sinceSeconds` снимало отсечку по времени и запрос
            выгребал историю борта целиком.
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 86400
            default: 3600
      responses:
        "200":
          description: >-
            Массив точек трека. Пустой массив означает, что за окно точек
            не накопилось: в отличие от карточки борта, отсутствие истории
            у существующего борта — это не 404.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackPoint"
        "400":
          description: >-
            `icao24` не прошёл проверку формата либо `sinceSeconds` вне
            диапазона 1…86400. Поле `message` заполнено по-русски.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"

  /airports:
    get:
      tags: [airports]
      summary: Список аэропортов из справочника OurAirports
      description: >-
        Справочник `ref_airports` (OurAirports) с фильтрацией, сортировкой
        и пагинацией — FR12. Загруженности, числа рейсов и индекса трафика
        здесь **нет**: считать их не из чего, в пайплайне нет ни одной таблицы
        рейсов.


        **Отдаются не все строки справочника.** В OurAirports 86 тысяч записей,
        из которых 23 тысячи вертодромов, 13 тысяч закрытых площадок, полторы
        тысячи гидроаэродромов и воздухоплавательных площадок. Наружу уходят
        только `large_airport`, `medium_airport` и `small_airport` — около
        48 тысяч. Отключить этот фильтр параметром нельзя: вертодром на карте
        рейсов не принимает, а список аэропортов он засоряет. Из-за него же
        `total` меньше `row_count` таблицы.


        **Первый запрос после старта сервиса занимает десятки секунд.**
        `ref_airports` — статическая таблица, `select_rows` по ней не работает
        («Table ... is not dynamic»), поэтому она читается целиком через
        `read_table`: ~20 МБ и порядка 40 секунд. Снапшот кладётся в память
        и живёт `YT_REF_AIRPORTS_CACHE_TTL_SECONDS` (сутки по умолчанию), так
        что последующие ответы — миллисекунды. Обратная сторона: перезалив
        справочника сервис заметит только после истечения TTL или рестарта.
      parameters:
        - name: search
          in: query
          required: false
          description: >-
            Подстрока без учёта регистра. Ищется по тем же полям, которые видны
            в ответе: `name`, `city`, `icao`, `iata`. Совпадение — именно
            подстрока, а не префикс: `sheremet` найдёт «Sheremetyevo
            International Airport».


            Подстановочных символов нет. Значение сравнивается в памяти
            и в запрос к YTsaurus не попадает, поэтому кавычка и процент —
            обычные символы: они просто ничему не соответствуют и дают пустой
            список, а не ошибку. Длиннее 100 символов значение обрезается.


            Поиск по коду аэропорта работает не для всех строк: `icao` — это
            `icao_code`, а если он пуст (88% записей OurAirports), то `ident`.
            У 785 записей заполнены оба и они различаются — такую строку
            найдёт `icao_code`, но не `ident`.
          schema:
            type: string
            example: "Sheremetyevo"
        - name: country
          in: query
          required: false
          description: >-
            Точное совпадение с `iso_country` — двухбуквенный код ISO 3166-1
            alpha-2, регистр не важен. Не подстрока: `RU` не найдёт `RUS`.
            Неизвестный код — пустой список и `total: 0`, а не 400.
          schema:
            type: string
            example: "RU"
        - name: sortBy
          in: query
          required: false
          description: >-
            Единственное поддержанное значение — `name` (по названию, без учёта
            регистра, ничьи разрешаются по `icao`). Значения `trafficIndex`
            и `totalFlights` из `docs/openapi.yaml` не реализованы: этих метрик
            в ответе нет.


            Без параметра порядок — как в таблице, то есть по `ident`
            по возрастанию; он детерминирован, поэтому пагинация без сортировки
            тоже не перемешивает страницы. Незнакомое значение молча
            игнорируется и даёт тот же табличный порядок.
          schema:
            type: string
            enum: [name]
        - name: page
          in: query
          required: false
          description: >-
            Номер страницы, начиная с 1. Значения меньше 1 подтягиваются к 1,
            а не отвергаются. Страница за концом выборки — пустой `items`
            при неизменном `total` и с тем самым `page`, который запросили.
          schema:
            type: integer
            default: 1
            example: 1
        - name: pageSize
          in: query
          required: false
          description: >-
            Размер страницы. Значение зажимается в диапазон 1…500, то есть
            `pageSize=100000` вернёт 500 записей и `pageSize: 500` в ответе —
            запросить весь справочник одним ответом нельзя.
          schema:
            type: integer
            default: 50
            maximum: 500
            example: 50
        - $ref: "#/components/parameters/LonMin"
        - $ref: "#/components/parameters/LatMin"
        - $ref: "#/components/parameters/LonMax"
        - $ref: "#/components/parameters/LatMax"
        - name: limit
          in: query
          required: false
          description: >-
            Картовый режим: сколько аэропортов вернуть одним ответом.
            Заданный `limit` **отменяет** табличную пагинацию — `page`
            и `pageSize` в запросе игнорируются, а в ответе приходят
            `page: 1` и `pageSize`, равный фактическому лимиту.
            `total` при этом остаётся полным размером выборки после
            фильтров, так что по нему видно, сколько объектов не поместилось.
            Значение зажимается в диапазон 1…10000.
          schema:
            type: integer
            maximum: 10000
            example: 500
      responses:
        "200":
          description: >-
            Страница справочника. Пустой `items` — валидный ответ: так выглядят
            и слишком узкий фильтр, и страница за концом выборки.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirportsListResponse"
        "400":
          description: >-
            Параметр не разобрался как число (`page=abc`, `latMin=север`)
            либо координата задана вне карты (`lonMin=NaN`, `latMax=200`).
            Осмысленные, но абсурдные значения (`page=0`, `pageSize=100000`,
            перевёрнутый bbox) под этот случай **не** подпадают — они
            обрабатываются молча. У координат `message` русский, у ошибок
            разбора — техническое пояснение от Spring, по-английски.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >-
            YTsaurus недоступен, вернул ошибку или таблицы `ref_airports` нет
            по настроенному пути — и при этом справочник ещё ни разу
            не читался. Если снапшот уже есть в памяти, ручка продолжает
            отвечать им, даже когда TTL истёк, а YTsaurus недоступен.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /pipeline-status:
    get:
      tags: [pipeline]
      summary: Состояние поставщика позиций
      description: >-
        Отвечает на вопрос «почему на карте пусто». Без этого эндпоинта
        отличить остановленный пайплайн от честно пустого участка карты
        невозможно — оба случая выглядят как `200 []`.


        Отвечает «едут ли данные вообще», но не «почему встали»: источник —
        таблица watermark'ов `pipeline_job_state`, причин остановки в ней нет.


        Достаточно поллить раз в 30 секунд, отдельно от позиций.
      responses:
        "200":
          description: >-
            Текущее состояние. Отвечает всегда, даже если пайплайн ни разу
            не запускался — тогда `status: unknown` и `stale: true`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineStatus"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"

  /stats/dashboard:
    get:
      tags: [stats]
      summary: Снапшот статистики для дашборда
      description: >-
        Единственный запрос дашборда: отдаёт последний посчитанный снапшот
        целиком — счётчики, распределение по фазам, топ аэропортов, топ
        маршрутов, разбивку по производителям и тренд.


        Параметров нет намеренно. Клиент не может попросить период: в YT лежит
        ровно один снапшот, и `computedAt` в ответе — единственное, что о его
        актуальности известно. Насколько снапшот свежий, клиент решает сам,
        сравнив `computedAt` с текущим временем; по NFR2 джоба обязана
        пересчитывать агрегаты не реже раза в час.
      responses:
        "200":
          description: >-
            Снапшот целиком. Нулевые счётчики — валидный ответ: так выглядит
            и пересчёт по пустому окну, и остановленный ингест. Отличить одно
            от другого по этой ручке нельзя.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"

  /stats/airports:
    get:
      tags: [stats]
      summary: Рейсы аэропортов за сутки
      description: >-
        Вылеты и прилёты каждого аэропорта, о котором в `airport_events` есть
        хотя бы одно событие, отсортированные по сумме рейсов. Это то самое
        `totalFlights24h`, которого нет в справочнике `positions-service`:
        рейсы считаются не по `ref_airports`, а по размеченным событиям.


        Окно — **последние сутки имеющихся данных**, а не последние сутки по
        часам сервиса: пайплайн встаёт, и по календарным суткам ответ был бы
        пустым при живых событиях вчерашнего батча. Фактические границы всегда
        приходят в `from`/`to`.
      responses:
        "200":
          description: Аэропорты с рейсами за окно; пустой список — валидный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirportsTrafficResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"

  /stats/hourly-traffic:
    get:
      tags: [stats]
      summary: Часовой профиль вылетов и прилётов
      description: >-
        Тайм-серия по `airport_events` с шагом в час. В отличие от
        `trafficTrend` из дашборда это профиль **по истории рейсов**, а не по
        моментам, когда отработала джоба, поэтому шаг ровный и по нему видно
        суточную волну.


        Часы без событий приходят явными нулями: без них на графике рвётся
        ось времени, а провал в данных выглядит как отсутствие точек.
      parameters:
        - name: icao
          in: query
          required: false
          description: >-
            Ограничить профиль одним аэропортом. Код проверяется форматом —
            буквы, цифры и дефис, 2–8 символов; всё остальное 400
          schema:
            type: string
            pattern: "^[A-Za-z0-9-]{2,8}$"
            example: "EDDK"
      responses:
        "200":
          description: Непрерывный ряд часов внутри окна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HourlyTrafficResponse"
        "400":
          description: Код аэропорта не подошёл под формат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"

  /stats/emergencies:
    get:
      tags: [stats]
      summary: Борта с сигналом бедствия
      description: >-
        Список бортов с кодом 7500 (захват судна) или 7700 (аварийная
        ситуация) — то же, что `emergencyCount` в дашборде, но поимённо
        и с координатами, чтобы их можно было показать на карте.


        Борта берутся из текущего снапшота `positions_current`, а не из
        агрегатов, поэтому актуальность отвечает `asOf`, а не `computedAt`.
        Борт, о котором не было позиции дольше
        `STATS_MAX_POSITION_AGE_SECONDS` (по умолчанию 300 с), из выдачи
        пропадает: `positions_current` хранит последнюю позицию вечно,
        и без отсечки вчерашний сигнал бедствия навсегда остался бы
        «текущим».
      responses:
        "200":
          description: >-
            Пустой список — штатный и самый частый ответ: в небе может не быть
            ни одного сигнала бедствия. Он же приходит, когда ингест стоит
            и все позиции протухли
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergenciesResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"

  /airports/{icao}/flights:
    get:
      tags: [airports]
      summary: Лог вылетов и прилётов аэропорта
      description: >-
        Уже наблюдённые рейсы, а не борд предстоящих: каждая запись — момент,
        когда пайплайн увидел борт у полосы, из `airport_events`.


        Позывной берётся из `flights_segments` по `flight_id`, авиакомпания —
        из `ref_aircraft` по `icao24`. Обоих может не быть: справочник ВС знает
        эксплуатанта примерно у трети бортов лога, и борт без него из выдачи
        **не** пропадает (FR4) — приходит `null`.


        `otherAirport` — противоположный конец маршрута, тоже оценка по треку,
        и он известен примерно у каждого десятого события. Продуктовый контракт
        описывает его как `EstimatedAirportRef` с `asOf` и `candidatesCount`;
        этих полей в YTsaurus нет, поэтому вместо них рядом с записью идут
        честные `confidence` и `distanceKm` из разметки.
      parameters:
        - $ref: "#/components/parameters/AirportIcao"
        - name: direction
          in: query
          required: false
          description: >-
            Фильтр направления. `all` и отсутствие параметра равнозначны;
            всё, кроме `arrival`, `departure` и `all`, — это 400
          schema:
            type: string
            enum: [arrival, departure, all]
            default: all
      responses:
        "200":
          description: >-
            Записи за то же окно, что у `/stats/airports`, свежие первыми.
            Пустой список означает, что за сутки данных аэропорт не отметился
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirportFlightsResponse"
        "400":
          description: Код аэропорта или направление не подошли под формат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Такого кода нет в `ref_airports`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"

  /airports/{icao}/stats:
    get:
      tags: [airports]
      summary: Рейсы одного аэропорта за сутки
      description: >-
        То же окно и тот же источник, что у `/stats/airports`, но по одному
        аэропорту — для карточки аэропорта.
      parameters:
        - $ref: "#/components/parameters/AirportIcao"
      responses:
        "200":
          description: >-
            Аэропорт есть в справочнике. Нули в счётчиках означают, что за окно
            по нему не было событий, — это не ошибка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirportStatsResponse"
        "400":
          description: Код аэропорта не подошёл под формат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >-
            Такого кода нет в `ref_airports`. Пока справочник не прочитан,
            отличить опечатку от живого аэропорта нельзя, и сервис отвечает
            статистикой, а не 404
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"

components:
  responses:
    SourceUnavailable:
      description: >-
        Источник данных не ответил или ответил негодным: YTsaurus недоступен,
        вернул ошибку либо прислал тело, которое не разбирается как ответ.
        Сервис при этом исправен, поэтому повторить запрос осмысленно.


        Сюда же попадает пустая `dashboard_totals` — джоба ещё ни разу
        не посчитала агрегаты. Отдавать в этом случае нули нельзя: дашборд
        показал бы «в небе никого» вместо «данных пока нет».


        Поле `message` заполнено по-русски и пригодно для показа
        пользователю; подробности источника (trace_id, текст запроса) остаются
        в логе сервиса и наружу не выходят.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: >-
        Сбой самого сервиса. Сюда же попадает запрос, который **отклонил**
        YTsaurus, — неверный путь таблицы, протухший токен, негодный QL:
        это дефект сервиса или его конфигурации, и, в отличие от 503,
        повтор не поможет.


        В `message` всегда «Внутренняя ошибка сервиса»: показывать клиенту
        внутренности нечего, диагностика — в логе.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  parameters:
    Icao24:
      name: icao24
      in: path
      required: true
      description: >-
        ICAO24-адрес борта: ровно 6 hex-символов. Регистр не важен, сервер
        приводит значение к нижнему. Всё, что не подходит под формат, —
        это 400 на любой ручке, а не «борт не найден».
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{6}$"
        example: "01023b"
    LonMin:
      name: lonMin
      in: query
      required: false
      description: >-
        Западная граница видимой области карты.


        Параметры `lonMin`/`latMin`/`lonMax`/`latMax` задаются **только все
        четыре вместе**. Если задан не весь набор, фильтр молча игнорируется
        и вернётся весь мир — ошибки при этом не будет, но ответ окажется
        на порядок тяжелее ожидаемого.


        Значение вне карты (`NaN`, `Infinity`, широта больше 90°) — это 400.
        А вот перевёрнутая рамка (`lonMin > lonMax` или `latMin > latMax`)
        вернёт пустую выдачу, а не ошибку. Переход через антимеридиан (±180°)
        не поддержан — такой bbox тоже даст пусто.


        Один и тот же набор имён используют все ручки с картой; порядок
        «долгота, потом широта» взят из продуктового контракта
        `docs/openapi.yaml`, из которого фронтенд генерит типы.
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
        example: -6.0
    LatMin:
      name: latMin
      in: query
      required: false
      description: Южная граница видимой области карты
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
        example: 41.0
    LonMax:
      name: lonMax
      in: query
      required: false
      description: Восточная граница видимой области карты
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
        example: 10.0
    LatMax:
      name: latMax
      in: query
      required: false
      description: Северная граница видимой области карты
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
        example: 52.0

    AirportIcao:
      name: icao
      in: path
      required: true
      description: >-
        Код аэропорта из `ref_airports`: буквы, цифры и дефис, 2–8 символов.
        Регистр не важен, сервер приводит значение к верхнему. Всё, что
        не подходит под формат, — это 400, а не «аэропорт не найден»
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{2,8}$"
        example: "EDDK"


  schemas:
    Flight:
      type: object
      description: >-
        Позиция борта из `positions_current`, обогащённая справочником ВС
        по `icao24`.


        Все поля всегда присутствуют в JSON; необязательность выражена через
        `nullable`, а не через отсутствие ключа.


        Строка, в которой нет `icao24`, `timePosition`, `lat` или `lon`,
        в выдачу не попадает вовсе: подставить туда ноль значило бы показать
        борт в Гвинейском заливе. Поэтому бортов в ответе может оказаться
        меньше, чем строк записал пайплайн, — расхождение видно в логе
        сервиса. На `GET /flights/{icao24}` такая строка даёт 503, а не 404:
        борт существует, негодны данные о нём.
      properties:
        icao24:
          type: string
          description: ICAO24-адрес, 6 hex-символов в нижнем регистре. Ключ борта
          example: "01023b"
        callsign:
          type: string
          nullable: true
          description: Позывной, уже обрезанный от пробелов
          example: "MSC2932"
        originCountry:
          type: string
          nullable: true
          description: Страна регистрации борта
          example: "Egypt"
        timePosition:
          type: integer
          format: int64
          description: Момент фиксации позиции, unix seconds
          example: 1786841273
        lat:
          type: number
          format: double
          description: Широта WGS-84, градусы
          example: 45.41
        lon:
          type: number
          format: double
          description: Долгота WGS-84, градусы
          example: 20.0
        baroAltitude:
          type: number
          format: double
          nullable: true
          description: Барометрическая высота в **метрах**
          example: 10957.5
        onGround:
          type: boolean
          description: Борт находится на земле
        velocity:
          type: number
          format: double
          nullable: true
          description: Путевая скорость в **м/с**
          example: 229.9
        trueTrack:
          type: number
          format: double
          nullable: true
          description: >-
            Курс в градусах от севера по часовой стрелке. Задаёт поворот
            иконки борта на карте
          example: 324.75
        manufacturername:
          type: string
          nullable: true
          description: >-
            Производитель из справочника ВС. Имя поля в одно слово и в нижнем
            регистре — так колонка называется в схеме YT
          example: "Airbus Industrie"
        model:
          type: string
          nullable: true
          description: Модель ВС из справочника
          example: "A320-251N"
        operator:
          type: string
          nullable: true
          description: >-
            Авиакомпания-эксплуатант. Борт, которого нет в справочнике ВС,
            всё равно возвращается (FR4) — тогда `manufacturername`, `model`
            и `operator` равны `null`
          example: "Air Cairo"
      required:
        - icao24
        - callsign
        - originCountry
        - timePosition
        - lat
        - lon
        - baroAltitude
        - onGround
        - velocity
        - trueTrack
        - manufacturername
        - model
        - operator

    TrackPoint:
      type: object
      description: Одна точка трека борта из `positions_history`
      properties:
        timePosition:
          type: integer
          format: int64
          description: Момент фиксации позиции, unix seconds
        lat:
          type: number
          format: double
          description: Широта WGS-84
        lon:
          type: number
          format: double
          description: Долгота WGS-84
        baroAltitude:
          type: number
          format: double
          nullable: true
          description: Барометрическая высота в метрах, позволяет красить трек по высоте
      required: [timePosition, lat, lon, baroAltitude]

    AirportsListResponse:
      type: object
      description: >-
        Страница справочника аэропортов. Конверт, в отличие от `/flights/live`,
        нужен: без `total` клиент не может нарисовать пагинацию.
      properties:
        asOf:
          type: integer
          format: int64
          nullable: true
          description: >-
            Момент последней записи таблицы `ref_airports` (unix seconds) —
            `modification_time` узла в Кипарисе, а не время ответа сервиса.
            Справочник статический и сам по себе не пересчитывается, так что
            это единственная осмысленная отметка свежести: она показывает,
            когда пайплайн залил справочник, и не меняется от запроса
            к запросу. `null` — атрибут не прочитался или не разобрался;
            нулём это отдавать нельзя, клиент нарисовал бы 1970 год.
          example: 1786793001
        items:
          type: array
          description: Аэропорты текущей страницы
          items:
            $ref: "#/components/schemas/Airport"
        page:
          type: integer
          description: >-
            Номер отданной страницы. Совпадает с запрошенным (после
            подтягивания значений < 1 к единице); в картовом режиме
            с `limit` всегда 1
          example: 1
        pageSize:
          type: integer
          description: >-
            Фактический размер страницы после зажатия в допустимый диапазон.
            В картовом режиме равен фактическому `limit`
          example: 50
        total:
          type: integer
          description: >-
            Сколько аэропортов подошло под фильтры — до пагинации и до `limit`,
            но уже **после** отсева нeаэропортовых типов
          example: 943
      required: [asOf, items, page, pageSize, total]

    Airport:
      type: object
      description: >-
        Запись справочника OurAirports. Полей `totalFlights24h`
        и `trafficIndex` из `docs/openapi.yaml` здесь нет: рейсов
        по аэропортам пайплайн не считает.


        Запись без кода, названия или координат в справочник не попадает —
        отрисовать и показать её всё равно нечем, а нули вместо координат
        увели бы аэропорт в Атлантику.
      properties:
        icao:
          type: string
          description: >-
            `icao_code` из OurAirports, а если он пуст — `ident`. Пустым
            не бывает, но и настоящим ICAO-кодом является не всегда: у 88%
            записей справочника `icao_code` не заполнен, и тогда сюда попадает
            локальный идентификатор вида `00AA` или `RU-0796`
          example: "UUEE"
        iata:
          type: string
          nullable: true
          description: IATA-код. `null` у 89% записей справочника — это норма, а не сбой
          example: "SVO"
        name:
          type: string
          description: Название аэропорта, как в OurAirports
          example: "Sheremetyevo International Airport"
        city:
          type: string
          nullable: true
          description: >-
            `municipality` из OurAirports. `null` примерно у 5% записей —
            населённый пункт в источнике не указан
          example: "Moscow"
        country:
          type: string
          nullable: true
          description: >-
            `iso_country`, код ISO 3166-1 alpha-2. По схеме таблицы поле
            необязательное, поэтому объявлено nullable, хотя в текущей
            выгрузке заполнено у всех строк
          example: "RU"
        position:
          $ref: "#/components/schemas/LatLon"
      required: [icao, iata, name, city, country, position]

    LatLon:
      type: object
      description: Точка WGS-84
      properties:
        lat:
          type: number
          format: double
          example: 55.976858
        lon:
          type: number
          format: double
          example: 37.41121
      required: [lat, lon]

    PipelineStatus:
      type: object
      description: >-
        Состояние пайплайна, собранное из таблицы `pipeline_job_state` —
        watermark'ов джобов вида `(job_name, watermark_ts, updated_at)`.
        Берётся джоб, отчитавшийся последним.


        Источник знает только, докуда доехали данные, поэтому единственный
        содержательный сигнал здесь — `stale`. Причину остановки он не
        различает: паузу по лимиту кредитов OpenSky, недоступность источника
        и упавший джоб внешне не отличить, `resumesAt` всегда `null`.
        Двухступенчатый UX («обновление приостановлено до HH:MM», затем
        «данные устарели») на этих данных не построить — для него нужен
        отдельный хартбит `ingest_service`.
      properties:
        status:
          type: string
          enum:
            - ok
            - unknown
          description: >-
            Отчитывался ли пайплайн вообще:


            * `ok` — в таблице есть строка джоба. Означает только это:
            «джоб зарегистрировал своё состояние». Работает ли он **сейчас**,
            показывает `stale`, а не этот код.


            * `unknown` — в `pipeline_job_state` нет ни одной строки: джобы
            ни разу не отчитывались либо таблицу пересоздали. Всегда приходит
            вместе со `stale: true`.
        lastSuccessAt:
          type: integer
          format: int64
          nullable: true
          description: >-
            Watermark последнего отчитавшегося джоба, unix seconds — граница,
            до которой данные обработаны. Считаем свежесть именно по нему,
            а не по времени записи: если джоб крутится, а источник умер,
            время записи растёт при стоящих данных. `null` — джоб
            зарегистрировался, но ещё ничего не обработал
        resumesAt:
          type: integer
          format: int64
          nullable: true
          description: >-
            Момент, когда опрос возобновится, unix seconds. С текущим
            источником **всегда `null`**: `pipeline_job_state` про паузы
            ничего не знает
        stale:
          type: boolean
          description: >-
            Данные считаются устаревшими: watermark не продвигался дольше
            `PIPELINE_STALE_AFTER_SECONDS` (по умолчанию 120 с).
            При `lastSuccessAt: null` всегда `true`
      required: [status, lastSuccessAt, resumesAt, stale]

    ApiError:
      type: object
      description: >-
        Единое тело ошибки сервиса: его формирует `ApiExceptionHandler` для
        всех кодов, включая 5xx. На всех ручках `/api/**` поле `message`
        есть всегда. Исключение одно: `406`, когда клиент просит формат,
        которого у сервиса нет, — тело в этом случае пустое, потому что
        сериализовать его не во что.


        У доменных ошибок (404) и у отказа YTsaurus (503) `message` написан
        по-русски и годится для показа пользователю. У ошибок самого Spring MVC
        (400 на неразобранный параметр, 405) там техническое пояснение
        по-английски — его лучше заменить своим текстом на клиенте.
      properties:
        timestamp:
          type: string
          format: date-time
          description: Момент формирования ответа, ISO-8601
          example: "2026-08-18T09:14:22.481Z"
        status:
          type: integer
          description: HTTP-код, дублирует статус ответа
          example: 404
        error:
          type: string
          description: Стандартное название HTTP-статуса
          example: "Not Found"
        message:
          type: string
          description: Причина ошибки; пустым не бывает
          example: "Позиция для борта icao24=abc123 не найдена"
      required: [timestamp, status, error, message]

    AirportRef:
      type: object
      description: >-
        Аэропорт в выдаче агрегатов. В `dashboard_*` лежит только ICAO —
        `iata` и `name` сервис добирает джойном с `ref_airports`
        (`icao_code`/`iata_code`/`name`). Если аэропорта в справочнике нет,
        оба поля приходят `null`, а сам аэропорт из выдачи не пропадает.
      properties:
        icao:
          type: string
          description: "[Derived] dashboard_top_airports.airport_icao"
          example: "EDDK"
        iata:
          type: string
          nullable: true
          description: "[OurAirports] ref_airports.iata_code"
          example: "CGN"
        name:
          type: string
          nullable: true
          description: "[OurAirports] ref_airports.name"
          example: "Cologne Bonn Airport"
      required: [icao, iata, name]

    Totals:
      type: object
      description: "Строка `dashboard_totals`, одна на весь снапшот."
      properties:
        activeFlights:
          type: integer
          description: "[OpenSky] dashboard_totals.active_flights"
          example: 917
        trackedAirports:
          type: integer
          description: "[OurAirports] dashboard_totals.tracked_airports"
          example: 38
        averageAltitudeM:
          type: number
          format: double
          nullable: true
          description: >-
            [Derived] `dashboard_totals.avg_altitude_m`, среднее по
            `states.baro_altitude`, метры. **Бывает `null`**: если в окне
            пересчёта не оказалось ни одного борта с высотой, джоба пишет
            `null`, а не 0 — ноль означал бы «летели на уровне моря».
          example: 9412.5
        averageSpeedKmh:
          type: number
          format: double
          nullable: true
          description: >-
            [Derived] `dashboard_totals.avg_velocity_mps` × 3.6 — среднее
            по `states.velocity`, **километры в час**. В YTsaurus поле лежит
            в м/с, пересчёт делает сервис.
          example: 797.0
      required: [activeFlights, trackedAirports, averageAltitudeM, averageSpeedKmh]

    FlightsByPhase:
      type: object
      description: >-
        Распределение бортов по фазам из `dashboard_totals`. Это **не** enum
        `FlightPhase` карты: в YT считается `airborne` — все борта не на земле,
        а не `cruising` в узком смысле. Порога «вертикальная скорость ≈ 0»
        джоба не применяет, поэтому `airborne` включает и `climbing`,
        и `descending`, и горизонтальный полёт — сумма по полям
        не равна `activeFlights`.
      properties:
        onGround:
          type: integer
          description: "[OpenSky] dashboard_totals.on_ground"
        airborne:
          type: integer
          description: "[OpenSky] dashboard_totals.airborne"
        climbing:
          type: integer
          description: "[OpenSky] dashboard_totals.climbing, vertical_rate > 0"
        descending:
          type: integer
          description: "[OpenSky] dashboard_totals.descending, vertical_rate < 0"
      required: [onGround, airborne, climbing, descending]

    BusiestAirport:
      type: object
      description: "Строка `dashboard_top_airports`, отсортировано по `rank`."
      properties:
        airport:
          $ref: "#/components/schemas/AirportRef"
        departures:
          type: integer
          description: "[Derived] dashboard_top_airports.departures"
          example: 12
        arrivals:
          type: integer
          description: "[Derived] dashboard_top_airports.arrivals"
          example: 64
        totalFlights:
          type: integer
          description: >-
            [Derived] `dashboard_top_airports.total_flights` — вылеты плюс
            прилёты, по нему же и отсортирована выдача.
          example: 74
      required: [airport, departures, arrivals, totalFlights]

    BusiestRoute:
      type: object
      description: >-
        Строка `dashboard_routes`. Пара строится по `flights_segments`,
        где аэропорты вылета и прилёта — **оценка** по ближайшей точке трека,
        поэтому в выдаче попадаются вырожденные пары вида `LIMC → LIMC`:
        борт взлетел и сел в одном аэропорту либо оценка не разошлась.
        Фильтровать их сервис не берётся — это забота джобы.
      properties:
        origin:
          $ref: "#/components/schemas/AirportRef"
        destination:
          $ref: "#/components/schemas/AirportRef"
        flightCount:
          type: integer
          description: "[Derived] dashboard_routes.flight_count"
          example: 5
      required: [origin, destination, flightCount]

    ManufacturerShare:
      type: object
      description: "Строка `dashboard_manufacturers`."
      properties:
        manufacturer:
          type: string
          description: >-
            [OpenSky Aircraft DB] `dashboard_manufacturers.manufacturer`.
            Борта, которых нет в справочнике, сведены в отдельную категорию
            `Unknown` — она обычно и самая крупная, и её стоит показывать
            отдельно от настоящих производителей.
          example: "Boeing"
        flightCount:
          type: integer
          description: "[Derived] dashboard_manufacturers.flight_count"
          example: 232
      required: [manufacturer, flightCount]

    CountryShare:
      type: object
      description: >-
        Страна регистрации борта. Считается сервисом на лету —
        `group by origin_country` по `positions_current`, отдельной таблицы
        `dashboard_*` под этот разрез нет. Поле заполнено у всех бортов,
        поэтому сумма `flightCount` совпадает с числом бортов в снапшоте
        позиций.
      properties:
        country:
          type: string
          description: "[OpenSky] positions_current.origin_country"
          example: "Germany"
        flightCount:
          type: integer
          description: "[Derived] число бортов страны в текущем снапшоте"
          example: 1035
      required: [country, flightCount]

    AirlineShare:
      type: object
      description: >-
        Авиакомпания-эксплуатант. Тоже считается на лету —
        `group by operator` по `positions_current`.


        Борта, у которых `operator` пуст, в выдачу **не попадают**: справочник
        OpenSky Aircraft DB покрывает лишь около шестой части бортов, и
        категория «Unknown» вышла бы крупнее всех настоящих авиакомпаний
        вместе взятых. Поэтому сумма `flightCount` заметно меньше
        `totals.activeFlights` — это ожидаемо, а не потеря данных.
      properties:
        airline:
          type: string
          description: "[OpenSky Aircraft DB] positions_current.operator"
          example: "Ryanair"
        flightCount:
          type: integer
          description: "[Derived] число бортов авиакомпании в текущем снапшоте"
          example: 214
      required: [airline, flightCount]

    AirportTraffic:
      type: object
      properties:
        airport:
          $ref: "#/components/schemas/AirportRef"
        departures:
          type: integer
          description: "[Derived] count(airport_events с direction=departure)"
          example: 13
        arrivals:
          type: integer
          description: "[Derived] count(airport_events с direction=arrival)"
          example: 71
        totalFlights24h:
          type: integer
          description: "[Derived] вылеты плюс прилёты за окно"
          example: 84
      required: [airport, departures, arrivals, totalFlights24h]

    AirportsTrafficResponse:
      type: object
      properties:
        from:
          type: integer
          format: int64
          description: Начало окна, unix seconds
        to:
          type: integer
          format: int64
          description: >-
            Конец окна — время последнего события в таблице, а не текущее
            время сервиса
        items:
          type: array
          items:
            $ref: "#/components/schemas/AirportTraffic"
      required: [from, to, items]

    AirportStatsResponse:
      type: object
      properties:
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
        airport:
          $ref: "#/components/schemas/AirportRef"
        departures:
          type: integer
        arrivals:
          type: integer
        totalFlights24h:
          type: integer
      required: [from, to, airport, departures, arrivals, totalFlights24h]

    FlightLogEntry:
      type: object
      properties:
        icao24:
          type: string
          description: "[OpenSky] airport_events.icao24"
          example: "4bccad"
        callsign:
          type: string
          nullable: true
          description: "[OpenSky] flights_segments.callsign по flight_id"
          example: "SXS4RX"
        airlineName:
          type: string
          nullable: true
          description: "[OpenSky Aircraft DB] ref_aircraft.operator по icao24"
          example: "SunExpress"
        direction:
          type: string
          enum: [arrival, departure]
        otherAirport:
          allOf:
            - $ref: "#/components/schemas/AirportRef"
          nullable: true
          description: >-
            Противоположный конец маршрута по оценке разметки; известен
            примерно у каждого десятого события
        observedAt:
          type: integer
          format: int64
          description: "[Derived] airport_events.event_ts — когда борт заметили у полосы"
          example: 1787133926
        confidence:
          type: number
          format: double
          description: >-
            [Derived] уверенность привязки события к аэропорту, 0..1.
            Заменяет `candidatesCount` продуктового контракта
          example: 0.97
        distanceKm:
          type: number
          format: double
          description: "[Derived] расстояние от борта до аэропорта в момент события"
          example: 0.4
      required:
        - icao24
        - callsign
        - airlineName
        - direction
        - otherAirport
        - observedAt
        - confidence
        - distanceKm

    AirportFlightsResponse:
      type: object
      properties:
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
        airport:
          $ref: "#/components/schemas/AirportRef"
        items:
          type: array
          description: Свежие записи первыми
          items:
            $ref: "#/components/schemas/FlightLogEntry"
      required: [from, to, airport, items]

    HourlyTrafficPoint:
      type: object
      properties:
        hour:
          type: integer
          format: int64
          description: Начало часа, unix seconds
          example: 1787130000
        departures:
          type: integer
        arrivals:
          type: integer
        totalFlights:
          type: integer
          description: Сумма — считает сервис, чтобы клиент не складывал сам
      required: [hour, departures, arrivals, totalFlights]

    HourlyTrafficResponse:
      type: object
      properties:
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
        points:
          type: array
          description: Непрерывный ряд часов внутри окна, включая пустые
          items:
            $ref: "#/components/schemas/HourlyTrafficPoint"
      required: [from, to, points]

    EmergencyFlight:
      type: object
      properties:
        icao24:
          type: string
          description: "[OpenSky] positions_current.icao24"
          example: "a981a8"
        callsign:
          type: string
          nullable: true
          description: "[OpenSky] positions_current.callsign"
          example: "N711VJ"
        squawk:
          type: string
          description: "[OpenSky] код ответчика: 7500 или 7700"
          example: "7700"
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        onGround:
          type: boolean
        timePosition:
          type: integer
          format: int64
          description: Момент фиксации позиции, unix seconds
      required: [icao24, callsign, squawk, lat, lon, onGround, timePosition]

    EmergenciesResponse:
      type: object
      properties:
        asOf:
          type: integer
          format: int64
          description: Момент запроса — борта берутся из текущего снапшота позиций
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmergencyFlight"
      required: [asOf, items]

    TrafficTrendPoint:
      type: object
      description: >-
        Точка `dashboard_trend`. Шаг между точками **неравномерный**: строка
        пишется на каждый пересчёт, а он идёт не по расписанию — в истории
        встречаются и две точки подряд с разницей в пару минут, и разрыв
        в несколько часов. Клиент обязан рисовать тренд по фактическим
        `timestamp`, а не по номеру точки.
      properties:
        timestamp:
          type: integer
          format: int64
          description: "[Derived] dashboard_trend.computed_at"
          example: 1787132036
        activeFlights:
          type: integer
          description: "[Derived] dashboard_trend.active_aircraft"
          example: 788
      required: [timestamp, activeFlights]

    DashboardResponse:
      type: object
      properties:
        computedAt:
          type: integer
          format: int64
          description: >-
            [Derived] `dashboard_totals.computed_at` — когда джоба посчитала
            снапшот. Заменяет `from`/`to` продуктового контракта: окна
            агрегации в YT нет, есть только момент пересчёта.
          example: 1787132036
        totals:
          $ref: "#/components/schemas/Totals"
        flightsByPhase:
          $ref: "#/components/schemas/FlightsByPhase"
        topBusiestAirports:
          type: array
          items:
            $ref: "#/components/schemas/BusiestAirport"
        busiestRoutes:
          type: array
          items:
            $ref: "#/components/schemas/BusiestRoute"
        aircraftByManufacturer:
          type: array
          items:
            $ref: "#/components/schemas/ManufacturerShare"
        topCountries:
          type: array
          description: >-
            Топ-10 стран регистрации. В отличие от остальных полей считается
            по `positions_current` в момент запроса, а не берётся из снапшота
            `dashboard_*`, — то есть отражает «сейчас», а не `computedAt`.
          items:
            $ref: "#/components/schemas/CountryShare"
        topAirlines:
          type: array
          description: "Топ-10 авиакомпаний, считается так же — по `positions_current`."
          items:
            $ref: "#/components/schemas/AirlineShare"
        trafficTrend:
          type: array
          description: "Отсортирован по `timestamp` по возрастанию."
          items:
            $ref: "#/components/schemas/TrafficTrendPoint"
        emergencyCount:
          type: integer
          description: >-
            [OpenSky] `dashboard_totals.emergency_squawks` — борта с кодом
            7500 или 7700 в окне пересчёта.
          example: 0
      required:
        - computedAt
        - totals
        - flightsByPhase
        - topBusiestAirports
        - busiestRoutes
        - aircraftByManufacturer
        - topCountries
        - topAirlines
        - trafficTrend
        - emergencyCount
