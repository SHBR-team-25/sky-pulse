openapi: 3.0.3
info:
  title: skyPulse analytics-service API
  description: >-
    Контракт того, что `analytics-service` **сможет отдать поверх сегодняшнего
    YTsaurus**. Источник правды — таблицы `dashboard_*`, которые считает
    SPYT-джоба; всё, чего в них нет, из контракта убрано, а не описано
    «на будущее».


    Главное следствие устройства этих таблиц: **произвольного окна агрегации
    нет**. `dashboard_totals`, `dashboard_top_airports`, `dashboard_routes`
    и `dashboard_manufacturers` — статические таблицы, которые джоба
    перезаписывает целиком, и единственная временная отметка в них —
    `computed_at`, момент пересчёта. Границы окна, за которое посчитаны
    агрегаты, нигде не хранятся, поэтому ручка не принимает `from`/`to`
    и возвращает один снапшот с полем `computedAt`. Единственная тайм-серия —
    `trafficTrend` из `dashboard_trend`.


    Единицы: время — unix seconds в UTC, высота — метры, скорость — **км/ч**.
    OpenSky и `dashboard_totals` хранят скорость в м/с; пересчёт ×3.6 делает
    сервис, чтобы дашборд не считал единицы сам.
  version: 0.1.0

servers:
  - url: /api

tags:
  - name: stats
    description: Агрегаты дашборда поверх истории полётов
  - name: airports
    description: Рейсы аэропортов по размеченным событиям

paths:
  /stats/dashboard:
    get:
      tags: [stats]
      summary: Снапшот статистики для дашборда
      description: >-
        Единственный запрос дашборда: отдаёт последний посчитанный снапшот
        целиком — счётчики, распределение по фазам, топ аэропортов, топ
        маршрутов, разбивку по производителям и тренд.


        Параметров нет намеренно. Клиент не может попросить период: в YT лежит
        ровно один снапшот, и `computedAt` в ответе — единственное, что о его
        актуальности известно. Насколько снапшот свежий, клиент решает сам,
        сравнив `computedAt` с текущим временем; по NFR2 джоба обязана
        пересчитывать агрегаты не реже раза в час.
      responses:
        "200":
          description: >-
            Снапшот целиком. Нулевые счётчики — валидный ответ: так выглядит
            и пересчёт по пустому окну, и остановленный ингест. Отличить одно
            от другого по этой ручке нельзя.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"

  /stats/airports:
    get:
      tags: [stats]
      summary: Рейсы аэропортов за сутки
      description: >-
        Вылеты и прилёты каждого аэропорта, о котором в `airport_events` есть
        хотя бы одно событие, отсортированные по сумме рейсов. Это то самое
        `totalFlights24h`, которого нет в справочнике `positions-service`:
        рейсы считаются не по `ref_airports`, а по размеченным событиям.


        Окно — **последние сутки имеющихся данных**, а не последние сутки по
        часам сервиса: пайплайн встаёт, и по календарным суткам ответ был бы
        пустым при живых событиях вчерашнего батча. Фактические границы всегда
        приходят в `from`/`to`.
      responses:
        "200":
          description: Аэропорты с рейсами за окно; пустой список — валидный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirportsTrafficResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"

  /stats/hourly-traffic:
    get:
      tags: [stats]
      summary: Часовой профиль вылетов и прилётов
      description: >-
        Тайм-серия по `airport_events` с шагом в час. В отличие от
        `trafficTrend` из дашборда это профиль **по истории рейсов**, а не по
        моментам, когда отработала джоба, поэтому шаг ровный и по нему видно
        суточную волну.


        Часы без событий приходят явными нулями: без них на графике рвётся
        ось времени, а провал в данных выглядит как отсутствие точек.
      parameters:
        - name: icao
          in: query
          required: false
          description: >-
            Ограничить профиль одним аэропортом. Код проверяется форматом —
            буквы, цифры и дефис, 2–8 символов; всё остальное 400
          schema:
            type: string
            pattern: "^[A-Za-z0-9-]{2,8}$"
            example: "EDDK"
      responses:
        "200":
          description: Непрерывный ряд часов внутри окна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HourlyTrafficResponse"
        "400":
          description: Код аэропорта не подошёл под формат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"

  /stats/emergencies:
    get:
      tags: [stats]
      summary: Борта с сигналом бедствия
      description: >-
        Список бортов с кодом 7500 (захват судна) или 7700 (аварийная
        ситуация) — то же, что `emergencyCount` в дашборде, но поимённо
        и с координатами, чтобы их можно было показать на карте.


        Борта берутся из текущего снапшота `positions_current`, а не из
        агрегатов, поэтому актуальность отвечает `asOf`, а не `computedAt`.
        Борт, о котором не было позиции дольше
        `STATS_MAX_POSITION_AGE_SECONDS` (по умолчанию 300 с), из выдачи
        пропадает: `positions_current` хранит последнюю позицию вечно,
        и без отсечки вчерашний сигнал бедствия навсегда остался бы
        «текущим».
      responses:
        "200":
          description: >-
            Пустой список — штатный и самый частый ответ: в небе может не быть
            ни одного сигнала бедствия. Он же приходит, когда ингест стоит
            и все позиции протухли
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergenciesResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"

  /airports/{icao}/flights:
    get:
      tags: [airports]
      summary: Лог вылетов и прилётов аэропорта
      description: >-
        Уже наблюдённые рейсы, а не борд предстоящих: каждая запись — момент,
        когда пайплайн увидел борт у полосы, из `airport_events`.


        Позывной берётся из `flights_segments` по `flight_id`, авиакомпания —
        из `ref_aircraft` по `icao24`. Обоих может не быть: справочник ВС знает
        эксплуатанта примерно у трети бортов лога, и борт без него из выдачи
        **не** пропадает (FR4) — приходит `null`.


        `otherAirport` — противоположный конец маршрута, тоже оценка по треку,
        и он известен примерно у каждого десятого события. Продуктовый контракт
        описывает его как `EstimatedAirportRef` с `asOf` и `candidatesCount`;
        этих полей в YTsaurus нет, поэтому вместо них рядом с записью идут
        честные `confidence` и `distanceKm` из разметки.
      parameters:
        - $ref: "#/components/parameters/AirportIcao"
        - name: direction
          in: query
          required: false
          description: >-
            Фильтр направления. `all` и отсутствие параметра равнозначны;
            всё, кроме `arrival`, `departure` и `all`, — это 400
          schema:
            type: string
            enum: [arrival, departure, all]
            default: all
      responses:
        "200":
          description: >-
            Записи за то же окно, что у `/stats/airports`, свежие первыми.
            Пустой список означает, что за сутки данных аэропорт не отметился
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirportFlightsResponse"
        "400":
          description: Код аэропорта или направление не подошли под формат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Такого кода нет в `ref_airports`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"

  /airports/{icao}/stats:
    get:
      tags: [airports]
      summary: Рейсы одного аэропорта за сутки
      description: >-
        То же окно и тот же источник, что у `/stats/airports`, но по одному
        аэропорту — для карточки аэропорта.
      parameters:
        - $ref: "#/components/parameters/AirportIcao"
      responses:
        "200":
          description: >-
            Аэропорт есть в справочнике. Нули в счётчиках означают, что за окно
            по нему не было событий, — это не ошибка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirportStatsResponse"
        "400":
          description: Код аэропорта не подошёл под формат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: >-
            Такого кода нет в `ref_airports`. Пока справочник не прочитан,
            отличить опечатку от живого аэропорта нельзя, и сервис отвечает
            статистикой, а не 404
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SourceUnavailable"

components:
  parameters:
    AirportIcao:
      name: icao
      in: path
      required: true
      description: >-
        Код аэропорта из `ref_airports`: буквы, цифры и дефис, 2–8 символов.
        Регистр не важен, сервер приводит значение к верхнему. Всё, что
        не подходит под формат, — это 400, а не «аэропорт не найден»
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{2,8}$"
        example: "EDDK"

  responses:
    SourceUnavailable:
      description: >-
        Источник данных не ответил или ответил негодным: YTsaurus недоступен,
        вернул ошибку либо прислал тело, которое не разбирается как ответ.
        Сервис при этом исправен, поэтому повторить запрос осмысленно.


        Сюда же попадает пустая `dashboard_totals` — джоба ещё ни разу
        не посчитала агрегаты. Отдавать в этом случае нули нельзя: дашборд
        показал бы «в небе никого» вместо «данных пока нет».


        Поле `message` заполнено по-русски и пригодно для показа
        пользователю; подробности источника остаются в логе сервиса.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: >-
        Сбой самого сервиса. Сюда же попадает запрос, который **отклонил**
        YTsaurus, — неверный путь таблицы, протухший токен, негодный QL:
        это дефект сервиса или его конфигурации, и, в отличие от 503,
        повтор не поможет.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    ApiError:
      type: object
      description: >-
        Единое тело ошибки сервиса: его формирует `ApiExceptionHandler` для
        всех кодов, включая 5xx. Поле `message` у отказа YTsaurus написано
        по-русски и годится для показа пользователю.
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-08-19T09:34:07.722Z"
        status:
          type: integer
          example: 503
        error:
          type: string
          example: "Service Unavailable"
        message:
          type: string
          example: "Источник данных YTsaurus недоступен, попробуйте повторить запрос позже"
      required: [timestamp, status, error, message]

    AirportRef:
      type: object
      description: >-
        Аэропорт в выдаче агрегатов. В `dashboard_*` лежит только ICAO —
        `iata` и `name` сервис добирает джойном с `ref_airports`
        (`icao_code`/`iata_code`/`name`). Если аэропорта в справочнике нет,
        оба поля приходят `null`, а сам аэропорт из выдачи не пропадает.
      properties:
        icao:
          type: string
          description: "[Derived] dashboard_top_airports.airport_icao"
          example: "EDDK"
        iata:
          type: string
          nullable: true
          description: "[OurAirports] ref_airports.iata_code"
          example: "CGN"
        name:
          type: string
          nullable: true
          description: "[OurAirports] ref_airports.name"
          example: "Cologne Bonn Airport"
      required: [icao, iata, name]

    Totals:
      type: object
      description: "Строка `dashboard_totals`, одна на весь снапшот."
      properties:
        activeFlights:
          type: integer
          description: "[OpenSky] dashboard_totals.active_flights"
          example: 917
        trackedAirports:
          type: integer
          description: "[OurAirports] dashboard_totals.tracked_airports"
          example: 38
        averageAltitudeM:
          type: number
          format: double
          nullable: true
          description: >-
            [Derived] `dashboard_totals.avg_altitude_m`, среднее по
            `states.baro_altitude`, метры. **Бывает `null`**: если в окне
            пересчёта не оказалось ни одного борта с высотой, джоба пишет
            `null`, а не 0 — ноль означал бы «летели на уровне моря».
          example: 9412.5
        averageSpeedKmh:
          type: number
          format: double
          nullable: true
          description: >-
            [Derived] `dashboard_totals.avg_velocity_mps` × 3.6 — среднее
            по `states.velocity`, **километры в час**. В YTsaurus поле лежит
            в м/с, пересчёт делает сервис.
          example: 797.0
      required: [activeFlights, trackedAirports, averageAltitudeM, averageSpeedKmh]

    FlightsByPhase:
      type: object
      description: >-
        Распределение бортов по фазам из `dashboard_totals`. Это **не** enum
        `FlightPhase` карты: в YT считается `airborne` — все борта не на земле,
        а не `cruising` в узком смысле. Порога «вертикальная скорость ≈ 0»
        джоба не применяет, поэтому `airborne` включает и `climbing`,
        и `descending`, и горизонтальный полёт — сумма по полям
        не равна `activeFlights`.
      properties:
        onGround:
          type: integer
          description: "[OpenSky] dashboard_totals.on_ground"
        airborne:
          type: integer
          description: "[OpenSky] dashboard_totals.airborne"
        climbing:
          type: integer
          description: "[OpenSky] dashboard_totals.climbing, vertical_rate > 0"
        descending:
          type: integer
          description: "[OpenSky] dashboard_totals.descending, vertical_rate < 0"
      required: [onGround, airborne, climbing, descending]

    BusiestAirport:
      type: object
      description: "Строка `dashboard_top_airports`, отсортировано по `rank`."
      properties:
        airport:
          $ref: "#/components/schemas/AirportRef"
        departures:
          type: integer
          description: "[Derived] dashboard_top_airports.departures"
          example: 12
        arrivals:
          type: integer
          description: "[Derived] dashboard_top_airports.arrivals"
          example: 64
        totalFlights:
          type: integer
          description: >-
            [Derived] `dashboard_top_airports.total_flights` — вылеты плюс
            прилёты, по нему же и отсортирована выдача.
          example: 74
      required: [airport, departures, arrivals, totalFlights]

    BusiestRoute:
      type: object
      description: >-
        Строка `dashboard_routes`. Пара строится по `flights_segments`,
        где аэропорты вылета и прилёта — **оценка** по ближайшей точке трека,
        поэтому в выдаче попадаются вырожденные пары вида `LIMC → LIMC`:
        борт взлетел и сел в одном аэропорту либо оценка не разошлась.
        Фильтровать их сервис не берётся — это забота джобы.
      properties:
        origin:
          $ref: "#/components/schemas/AirportRef"
        destination:
          $ref: "#/components/schemas/AirportRef"
        flightCount:
          type: integer
          description: "[Derived] dashboard_routes.flight_count"
          example: 5
      required: [origin, destination, flightCount]

    ManufacturerShare:
      type: object
      description: "Строка `dashboard_manufacturers`."
      properties:
        manufacturer:
          type: string
          description: >-
            [OpenSky Aircraft DB] `dashboard_manufacturers.manufacturer`.
            Борта, которых нет в справочнике, сведены в отдельную категорию
            `Unknown` — она обычно и самая крупная, и её стоит показывать
            отдельно от настоящих производителей.
          example: "Boeing"
        flightCount:
          type: integer
          description: "[Derived] dashboard_manufacturers.flight_count"
          example: 232
      required: [manufacturer, flightCount]

    CountryShare:
      type: object
      description: >-
        Страна регистрации борта. Считается сервисом на лету —
        `group by origin_country` по `positions_current`, отдельной таблицы
        `dashboard_*` под этот разрез нет. Поле заполнено у всех бортов,
        поэтому сумма `flightCount` совпадает с числом бортов в снапшоте
        позиций.
      properties:
        country:
          type: string
          description: "[OpenSky] positions_current.origin_country"
          example: "Germany"
        flightCount:
          type: integer
          description: "[Derived] число бортов страны в текущем снапшоте"
          example: 1035
      required: [country, flightCount]

    AirlineShare:
      type: object
      description: >-
        Авиакомпания-эксплуатант. Тоже считается на лету —
        `group by operator` по `positions_current`.


        Борта, у которых `operator` пуст, в выдачу **не попадают**: справочник
        OpenSky Aircraft DB покрывает лишь около шестой части бортов, и
        категория «Unknown» вышла бы крупнее всех настоящих авиакомпаний
        вместе взятых. Поэтому сумма `flightCount` заметно меньше
        `totals.activeFlights` — это ожидаемо, а не потеря данных.
      properties:
        airline:
          type: string
          description: "[OpenSky Aircraft DB] positions_current.operator"
          example: "Ryanair"
        flightCount:
          type: integer
          description: "[Derived] число бортов авиакомпании в текущем снапшоте"
          example: 214
      required: [airline, flightCount]

    AirportTraffic:
      type: object
      properties:
        airport:
          $ref: "#/components/schemas/AirportRef"
        departures:
          type: integer
          description: "[Derived] count(airport_events с direction=departure)"
          example: 13
        arrivals:
          type: integer
          description: "[Derived] count(airport_events с direction=arrival)"
          example: 71
        totalFlights24h:
          type: integer
          description: "[Derived] вылеты плюс прилёты за окно"
          example: 84
      required: [airport, departures, arrivals, totalFlights24h]

    AirportsTrafficResponse:
      type: object
      properties:
        from:
          type: integer
          format: int64
          description: Начало окна, unix seconds
        to:
          type: integer
          format: int64
          description: >-
            Конец окна — время последнего события в таблице, а не текущее
            время сервиса
        items:
          type: array
          items:
            $ref: "#/components/schemas/AirportTraffic"
      required: [from, to, items]

    AirportStatsResponse:
      type: object
      properties:
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
        airport:
          $ref: "#/components/schemas/AirportRef"
        departures:
          type: integer
        arrivals:
          type: integer
        totalFlights24h:
          type: integer
      required: [from, to, airport, departures, arrivals, totalFlights24h]

    FlightLogEntry:
      type: object
      properties:
        icao24:
          type: string
          description: "[OpenSky] airport_events.icao24"
          example: "4bccad"
        callsign:
          type: string
          nullable: true
          description: "[OpenSky] flights_segments.callsign по flight_id"
          example: "SXS4RX"
        airlineName:
          type: string
          nullable: true
          description: "[OpenSky Aircraft DB] ref_aircraft.operator по icao24"
          example: "SunExpress"
        direction:
          type: string
          enum: [arrival, departure]
        otherAirport:
          allOf:
            - $ref: "#/components/schemas/AirportRef"
          nullable: true
          description: >-
            Противоположный конец маршрута по оценке разметки; известен
            примерно у каждого десятого события
        observedAt:
          type: integer
          format: int64
          description: "[Derived] airport_events.event_ts — когда борт заметили у полосы"
          example: 1787133926
        confidence:
          type: number
          format: double
          description: >-
            [Derived] уверенность привязки события к аэропорту, 0..1.
            Заменяет `candidatesCount` продуктового контракта
          example: 0.97
        distanceKm:
          type: number
          format: double
          description: "[Derived] расстояние от борта до аэропорта в момент события"
          example: 0.4
      required:
        - icao24
        - callsign
        - airlineName
        - direction
        - otherAirport
        - observedAt
        - confidence
        - distanceKm

    AirportFlightsResponse:
      type: object
      properties:
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
        airport:
          $ref: "#/components/schemas/AirportRef"
        items:
          type: array
          description: Свежие записи первыми
          items:
            $ref: "#/components/schemas/FlightLogEntry"
      required: [from, to, airport, items]

    HourlyTrafficPoint:
      type: object
      properties:
        hour:
          type: integer
          format: int64
          description: Начало часа, unix seconds
          example: 1787130000
        departures:
          type: integer
        arrivals:
          type: integer
        totalFlights:
          type: integer
          description: Сумма — считает сервис, чтобы клиент не складывал сам
      required: [hour, departures, arrivals, totalFlights]

    HourlyTrafficResponse:
      type: object
      properties:
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
        points:
          type: array
          description: Непрерывный ряд часов внутри окна, включая пустые
          items:
            $ref: "#/components/schemas/HourlyTrafficPoint"
      required: [from, to, points]

    EmergencyFlight:
      type: object
      properties:
        icao24:
          type: string
          description: "[OpenSky] positions_current.icao24"
          example: "a981a8"
        callsign:
          type: string
          nullable: true
          description: "[OpenSky] positions_current.callsign"
          example: "N711VJ"
        squawk:
          type: string
          description: "[OpenSky] код ответчика: 7500 или 7700"
          example: "7700"
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        onGround:
          type: boolean
        timePosition:
          type: integer
          format: int64
          description: Момент фиксации позиции, unix seconds
      required: [icao24, callsign, squawk, lat, lon, onGround, timePosition]

    EmergenciesResponse:
      type: object
      properties:
        asOf:
          type: integer
          format: int64
          description: Момент запроса — борта берутся из текущего снапшота позиций
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmergencyFlight"
      required: [asOf, items]

    TrafficTrendPoint:
      type: object
      description: >-
        Точка `dashboard_trend`. Шаг между точками **неравномерный**: строка
        пишется на каждый пересчёт, а он идёт не по расписанию — в истории
        встречаются и две точки подряд с разницей в пару минут, и разрыв
        в несколько часов. Клиент обязан рисовать тренд по фактическим
        `timestamp`, а не по номеру точки.
      properties:
        timestamp:
          type: integer
          format: int64
          description: "[Derived] dashboard_trend.computed_at"
          example: 1787132036
        activeFlights:
          type: integer
          description: "[Derived] dashboard_trend.active_aircraft"
          example: 788
      required: [timestamp, activeFlights]

    DashboardResponse:
      type: object
      properties:
        computedAt:
          type: integer
          format: int64
          description: >-
            [Derived] `dashboard_totals.computed_at` — когда джоба посчитала
            снапшот. Заменяет `from`/`to` продуктового контракта: окна
            агрегации в YT нет, есть только момент пересчёта.
          example: 1787132036
        totals:
          $ref: "#/components/schemas/Totals"
        flightsByPhase:
          $ref: "#/components/schemas/FlightsByPhase"
        topBusiestAirports:
          type: array
          items:
            $ref: "#/components/schemas/BusiestAirport"
        busiestRoutes:
          type: array
          items:
            $ref: "#/components/schemas/BusiestRoute"
        aircraftByManufacturer:
          type: array
          items:
            $ref: "#/components/schemas/ManufacturerShare"
        topCountries:
          type: array
          description: >-
            Топ-10 стран регистрации. В отличие от остальных полей считается
            по `positions_current` в момент запроса, а не берётся из снапшота
            `dashboard_*`, — то есть отражает «сейчас», а не `computedAt`.
          items:
            $ref: "#/components/schemas/CountryShare"
        topAirlines:
          type: array
          description: "Топ-10 авиакомпаний, считается так же — по `positions_current`."
          items:
            $ref: "#/components/schemas/AirlineShare"
        trafficTrend:
          type: array
          description: "Отсортирован по `timestamp` по возрастанию."
          items:
            $ref: "#/components/schemas/TrafficTrendPoint"
        emergencyCount:
          type: integer
          description: >-
            [OpenSky] `dashboard_totals.emergency_squawks` — борта с кодом
            7500 или 7700 в окне пересчёта.
          example: 0
      required:
        - computedAt
        - totals
        - flightsByPhase
        - topBusiestAirports
        - busiestRoutes
        - aircraftByManufacturer
        - topCountries
        - topAirlines
        - trafficTrend
        - emergencyCount
