server:
  port: ${PORT:8081}
  error:
    # Контейнерные ошибки уходят в /error мимо ApiExceptionHandler, и без этого
    # тело приходит без message — единственного поля, которое можно показать.
    include-message: always

spring:
  application:
    name: analytics-service
  config:
    import: "optional:file:.env[.properties]"

management:
  endpoints:
    web:
      exposure:
        include: health, info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

skypulse:
  yt:
    proxy: ${YT_PROXY:localhost:80}
    token: ${YT_TOKEN:}
    connect-timeout-seconds: ${YT_CONNECT_TIMEOUT_SECONDS:3}
    read-timeout-seconds: ${YT_READ_TIMEOUT_SECONDS:20}
    ref-airports-path: ${YT_REF_AIRPORTS_PATH://home/skypulse/ref_airports}
    # Агрегаты считает SPYT-джоба, сервис только читает готовые таблицы.
    dashboard-totals-path: ${YT_DASHBOARD_TOTALS_PATH://home/skypulse/dashboard_totals}
    dashboard-trend-path: ${YT_DASHBOARD_TREND_PATH://home/skypulse/dashboard_trend}
    dashboard-top-airports-path: ${YT_DASHBOARD_TOP_AIRPORTS_PATH://home/skypulse/dashboard_top_airports}
    dashboard-routes-path: ${YT_DASHBOARD_ROUTES_PATH://home/skypulse/dashboard_routes}
    dashboard-manufacturers-path: ${YT_DASHBOARD_MANUFACTURERS_PATH://home/skypulse/dashboard_manufacturers}
