server:
  port: ${PORT:8080}

spring:
  application:
    name: positions-service
  config:
    import: "optional:file:.env[.properties]"

management:
  endpoints:
    web:
      exposure:
        include: health, info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

skypulse:
  yt:
    proxy: ${YT_PROXY:localhost:80}
    token: ${YT_TOKEN:}
    positions-current-path: ${YT_POSITIONS_CURRENT_PATH://home/skypulse/positions_current}
    positions-history-path: ${YT_POSITIONS_HISTORY_PATH://home/skypulse/positions_history}
    ingest-heartbeat-path: ${YT_INGEST_HEARTBEAT_PATH://home/skypulse/ingest_heartbeat}
    # Борт, о котором давно не было позиции, скорее всего сел.
    max-position-age-seconds: ${YT_MAX_POSITION_AGE_SECONDS:300}
    max-current-positions: ${YT_MAX_CURRENT_POSITIONS:5000}
  pipeline:
    # Несколько пропущенных опросов подряд при интервале 15 с.
    stale-after-seconds: ${PIPELINE_STALE_AFTER_SECONDS:120}
